services:
    app.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            - endpoint: '%env(S3_ENDPOINT)%'
              region: '%env(S3_REGION)%'
              accessKeyId: '%env(S3_ACCESS_KEY)%'
              accessKeySecret: '%env(S3_SECRET_KEY)%'
              pathStyleEndpoint: true

flysystem:
    storages:
        equipment.storage:
            adapter: 'asyncaws'
            options: { client: 'app.s3_client', bucket: '%env(S3_EQUIPMENT_BUCKET)%' }
        condition.storage:
            adapter: 'asyncaws'
            options: { client: 'app.s3_client', bucket: '%env(S3_CONDITION_BUCKET)%' }
