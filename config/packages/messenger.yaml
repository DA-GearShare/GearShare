framework:
    messenger:
        # Messages that exhaust their retries end up here instead of being lost.
        failure_transport: failed

        transports:
            # Dedicated queue for outgoing mail, so a slow SMTP server never blocks other background jobs
            email:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: email
                retry_strategy:
                    max_retries: 3
                    delay: 10000      # 10s before the first retry
                    multiplier: 3     # then 30s, then 90s
                    max_delay: 600000 # never wait more than 10 minutes
                    jitter: 0.1       # spread retries so they don't stampede

            failed:
                dsn: 'doctrine://default?queue_name=failed&auto_setup=0'

            sync: 'sync://'

        routing:
            # Every email sent through MailerInterface goes to the email queue.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: email

when@test:
    framework:
        messenger:
            transports:
                # Keeps messages in memory so tests can inspect what was queued.
                email: 'in-memory://'
                failed: 'in-memory://'
