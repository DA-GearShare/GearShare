# Dev gateway on port 80: one URL for the whole project.
#   /api, Symfony dev tools, index.php, bundles  ->  Symfony (Apache, container "app")
#   everything else (incl. the HMR websocket)    ->  Vite dev server (container "frontend")
# Add any other backend-only URL prefixes to the Symfony location below.

# Docker's embedded DNS. Using variables in proxy_pass makes nginx resolve the names
# when a request arrives, so it starts even if a container is still booting and
# picks up new IPs after a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Same as upload_max_filesize / post_max_size in the app's PHP config.
  client_max_body_size 100M;

  set $backend  http://app:80;
  set $frontend http://frontend:5173;

  location ~ ^/(api|_wdt|_profiler|_error|bundles|index\.php)(/|$) {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location / {
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Hot-module-reload websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
