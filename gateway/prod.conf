# Production gateway (baked into the image by gateway/Dockerfile).
#   /api, /connect, /bundles, index.php  ->  Symfony (Apache, container "app")
#   /media, /_internal                   ->  see snippets/media.conf
#   everything else                      ->  built SPA from /usr/share/nginx/html
# Symfony's dev tools (/_profiler, /_wdt) don't exist in prod and are not routed.
# Keep the backend prefixes in sync with gateway/default.conf.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  include /etc/nginx/snippets/*;

  client_max_body_size 100M;

  set $backend http://app:80;

  location ~ ^/(api|connect|bundles|index\.php)(/|$) {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  root /usr/share/nginx/html;

  # Vite puts hashed files here, so their content never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA: unknown paths are client-side routes.
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }

  # index.html must always be revalidated, or users keep old asset hashes.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
