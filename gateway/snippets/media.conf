# Media routes for the gateway. Included from gateway/default.conf inside `server { }`:
#
#     include /etc/nginx/snippets/*;
#
# This REPLACES any existing `location /media/ { ... }` block. Remove the old one,
# nginx rejects duplicate locations.
#
# Two buckets live in the SeaweedFS filer under /buckets/<bucket>/<key>:
#   equipment  public, GET/HEAD only, protected by the unguessable UUID
#   condition  private. Only reachable through the internal location below, which the
#              app triggers with `X-Accel-Redirect` after its own auth check
#              (uploader or admin, see App\Security\Voter\ConditionPhotoVoter).
#
# Uploads never touch these routes: browsers POST to /api/... and the app writes to S3.

# Resolved per request via the `resolver` in default.conf, like $backend/$frontend.
# Must be set at server level: inside a location it would come after `rewrite ... break`
# and never run.
set $seaweedfs http://seaweedfs:8888;

# --- Public: equipment photos --------------------------------------------------------
# The strict UUID regex is the security boundary. It blocks directory listings,
# other buckets and path traversal (..%2f) because nothing else can match.
location ~ ^/media/equipment/(?<photo_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$ {
    limit_except GET HEAD { deny all; }

    rewrite ^ /buckets/equipment/$photo_id break;
    proxy_pass $seaweedfs;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A replaced photo gets a new UUID, so the content behind a URL never changes.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Same origin as the app: never let an uploaded file run as a page.
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}

# Everything else below /media/ does not exist (no condition bucket, no listings).
location /media/ {
    return 404;
}

# --- Private: condition photos -------------------------------------------------------
# `internal` = only reachable via X-Accel-Redirect / internal redirects, never by a
# browser. The app answers GET /api/v1/condition-photos/<id> with
#   X-Accel-Redirect: /_internal/condition/<id>
# after the voter said yes. Do not add `proxy_ignore_headers X-Accel-Redirect`
# to the /api location, or this stops working.
#
# Cache-Control comes from the Symfony response (private, no-cache) and is kept by
# nginx across the redirect, so it is NOT added here (would duplicate the header).
location ~ ^/_internal/condition/(?<photo_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$ {
    internal;

    rewrite ^ /buckets/condition/$photo_id break;
    proxy_pass $seaweedfs;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The browser's cookie/session is for Symfony, not for the filer.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}

# Direct requests to anything under /_internal/ get a plain 404 instead of falling
# through to the frontend.
location /_internal/ {
    return 404;
}
